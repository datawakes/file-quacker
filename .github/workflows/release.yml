name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend run build

      - name: Build Windows exe
        run: pyinstaller file_quacker.spec

      - name: Sanity-check exe
        shell: bash
        run: |
          set -e
          test -f dist/file_quacker.exe
          # Bundle should be at least 5 MB; smaller means something went
          # wrong (frontend/dist not picked up, dependencies stripped).
          size=$(stat -c%s dist/file_quacker.exe 2>/dev/null || stat -f%z dist/file_quacker.exe)
          echo "exe size: $size bytes"
          [ "$size" -gt 5000000 ]

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/file_quacker.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
